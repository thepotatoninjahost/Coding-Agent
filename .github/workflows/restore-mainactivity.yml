name: Restore MainActivity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore MainActivity
        run: |
          set -euo pipefail
          GOOD=ee8a643a24bb359b327a15a350e686f26bcbfad9
          TARGET=app/src/main/java/com/codingagent/ui/MainActivity.kt
          git show "$GOOD:$TARGET" > "$TARGET"
          python3 -c "
          from pathlib import Path
          p = Path('app/src/main/java/com/codingagent/ui/MainActivity.kt')
          t = p.read_text()
          old = '''private val Ink = Color(0xFFE8EDF2)\nprivate val Muted = Color(0xFF94A0AE)\nprivate val Canvas = Color(0xFF0A0D11)\nprivate val Panel = Color(0xFF131922)\nprivate val PanelRaised = Color(0xFF1A2330)\nprivate val Line = Color(0xFF2B3848)\nprivate val Accent = Color(0xFF8FE36B)\nprivate val Blue = Color(0xFF8CB9FF)\nprivate val Amber = Color(0xFFFFC857)\nprivate val Danger = Color(0xFFFF756D)'''
          new = '''// Pip-Boy-inspired layout - neon green, fluorescent orange, dark purple\nprivate val Ink = Color(0xFF39FF14)\nprivate val Muted = Color(0xFF7ACC7A)\nprivate val Canvas = Color(0xFF1A0A2E)\nprivate val Panel = Color(0xFF2D1B4E)\nprivate val PanelRaised = Color(0xFF3D2A5C)\nprivate val Line = Color(0xFF5A3D7A)\nprivate val Accent = Color(0xFF39FF14)\nprivate val Blue = Color(0xFFFF5F1F)\nprivate val Amber = Color(0xFFFF5F1F)\nprivate val Danger = Color(0xFFFF4500)'''
          assert old in t, 'color block not found'
          t = t.replace(old, new)
          t = t.replace('Color(0xFF322B19)', 'Color(0xFF3D2A5C)')
          t = t.replace('Color(0xFF442126)', 'Color(0xFF4A2030)')
          t = t.replace('Color(0xFF263B29)', 'Color(0xFF1A3A20)')
          t = t.replace('Color(0xFF0F1319)', 'Color(0xFF12081F)')
          assert 'CodingAgentApp' in t and 'fieldColors' in t
          assert '0xFF39FF14' in t and '0xFF1A0A2E' in t
          p.write_text(t)
          print('ok', len(t))
          "

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codingagent/ui/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Restore full MainActivity: neon green, fluorescent orange, dark purple'
          git push origin HEAD:main
