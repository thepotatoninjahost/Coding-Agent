name: Restore MainActivity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-mainactivity.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore full MainActivity and apply color palette
        run: |
          set -euo pipefail
          GOOD=ee8a643a24bb359b327a15a350e686f26bcbfad9
          TARGET=app/src/main/java/com/codingagent/ui/MainActivity.kt
          git show "$GOOD:$TARGET" > "$TARGET"

          python3 <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/codingagent/ui/MainActivity.kt")
          t = p.read_text()
          old = """private val Ink = Color(0xFFE8EDF2)
private val Muted = Color(0xFF94A0AE)
private val Canvas = Color(0xFF0A0D11)
private val Panel = Color(0xFF131922)
private val PanelRaised = Color(0xFF1A2330)
private val Line = Color(0xFF2B3848)
private val Accent = Color(0xFF8FE36B)
private val Blue = Color(0xFF8CB9FF)
private val Amber = Color(0xFFFFC857)
private val Danger = Color(0xFFFF756D)"""
          new = """// Pip-Boy-inspired layout · palette: neon green, fluorescent orange, dark purple
private val Ink = Color(0xFF39FF14)
private val Muted = Color(0xFF7ACC7A)
private val Canvas = Color(0xFF1A0A2E)
private val Panel = Color(0xFF2D1B4E)
private val PanelRaised = Color(0xFF3D2A5C)
private val Line = Color(0xFF5A3D7A)
private val Accent = Color(0xFF39FF14)
private val Blue = Color(0xFFFF5F1F)
private val Amber = Color(0xFFFF5F1F)
private val Danger = Color(0xFFFF4500)"""
          if old not in t:
              raise SystemExit("color block not found")
          t = t.replace(old, new)
          t = t.replace("Color(0xFF322B19)", "Color(0xFF3D2A5C)")
          t = t.replace("Color(0xFF442126)", "Color(0xFF4A2030)")
          t = t.replace("Color(0xFF263B29)", "Color(0xFF1A3A20)")
          t = t.replace("Color(0xFF0F1319)", "Color(0xFF12081F)")
          if "CodingAgentApp" not in t or "fieldColors" not in t:
              raise SystemExit("Restored MainActivity is incomplete")
          if "0xFF39FF14" not in t or "0xFF1A0A2E" not in t or "0xFFFF5F1F" not in t:
              raise SystemExit("color palette missing")
          if "ROBCO" in t:
              raise SystemExit("unexpected ROBCO header")
          p.write_text(t)
          print("Restored full MainActivity, bytes=", len(t))
          PY

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codingagent/ui/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restore full MainActivity: neon green, fluorescent orange, dark purple"
          git push origin HEAD:main
