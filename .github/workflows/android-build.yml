name: Android build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test Coding Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Security baseline audit
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch app/debug-signing.keystore.b64 >/dev/null 2>&1; then
            echo "ERROR: repository-stored private debug signing material is tracked."
            exit 1
          fi
          if find . -type f \( -name "*.keystore" -o -name "*.jks" \) -not -path "./.git/*" -not -path "*/build/*" -print | grep -q .; then
            echo "ERROR: private signing material exists in the source tree."
            exit 1
          fi
          if git grep -n -E 'Mozilla/5\.0|Chrome/[0-9]+|Pixel 8' -- app/src/main >/dev/null 2>&1; then
            echo "ERROR: browser/device impersonation remains in application source."
            exit 1
          fi

      - name: Verify Gradle Wrapper JAR checksum
        shell: bash
        run: |
          set -euo pipefail
          expected='cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8'
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f 1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: Gradle Wrapper JAR checksum mismatch."
            echo "Expected official Gradle 8.7 Wrapper JAR SHA-256: $expected"
            exit 1
          fi
          echo "Gradle Wrapper JAR checksum matches the official Gradle 8.7 checksum."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile unit test sources
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Acceptance path tests (explicit)
        run: ./gradlew :app:testDebugUnitTest --tests "com.codingagent.core.AcceptancePathTest" --tests "com.codingagent.core.StorageGuardTest" --tests "com.codingagent.core.AutonomousLoopTest" --no-daemon --stacktrace

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 5

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coding-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app and run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Android instrumentation reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 5
