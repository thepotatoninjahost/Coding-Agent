name: Android build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test Coding Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # setup-android accepts licenses by default; explicit flag + re-accept so a
          # headless CI machine cannot fail later with LicenceNotAcceptedException.
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Security baseline audit
        shell: bash
        run: |
          set -euo pipefail

          # 1) No private signing material tracked or left in the tree
          if git ls-files --error-unmatch app/debug-signing.keystore.b64 >/dev/null 2>&1; then
            echo "ERROR: repository-stored private debug signing material is tracked."
            exit 1
          fi
          if find . -type f \( -name "*.keystore" -o -name "*.jks" \) \
              ! -path "./.git/*" \
              ! -path "*/build/*" \
              -print -quit | grep -q .; then
            echo "ERROR: private signing material exists in the source tree."
            find . -type f \( -name "*.keystore" -o -name "*.jks" \) \
              ! -path "./.git/*" ! -path "*/build/*" -print
            exit 1
          fi

          # 2) No browser/device impersonation User-Agents in production source
          #    (honest "Coding-Agent/..." agents are allowed; Mozilla/Chrome/Pixel/Samsung spoofing is not)
          if git grep -n -E 'Mozilla/5\.0|Chrome/[0-9]+\.|Pixel [0-9]|SamsungBrowser|Windows NT [0-9]|iPhone OS|Android [0-9]+;[^"]*Chrome' -- app/src/main >/dev/null 2>&1; then
            echo "ERROR: browser/device impersonation remains in application source."
            git grep -n -E 'Mozilla/5\.0|Chrome/[0-9]+\.|Pixel [0-9]|SamsungBrowser|Windows NT [0-9]|iPhone OS|Android [0-9]+;[^"]*Chrome' -- app/src/main || true
            exit 1
          fi

          # 3) No hardcoded secret shapes in production source (app/src/main only;
          #    unit tests may use fake sk-/Bearer strings to prove redaction works)
          if git grep -n -E \
              -e 'BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY' \
              -e 'sk-[a-zA-Z0-9]{20,}' \
              -e 'sk_live_[a-zA-Z0-9]{20,}' \
              -e 'ghp_[a-zA-Z0-9]{36}' \
              -e 'github_pat_[a-zA-Z0-9_]{20,}' \
              -e 'AKIA[0-9A-Z]{16}' \
              -- app/src/main >/dev/null 2>&1; then
            echo "ERROR: possible hardcoded secret pattern in app/src/main."
            git grep -n -E \
              -e 'BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY' \
              -e 'sk-[a-zA-Z0-9]{20,}' \
              -e 'sk_live_[a-zA-Z0-9]{20,}' \
              -e 'ghp_[a-zA-Z0-9]{36}' \
              -e 'github_pat_[a-zA-Z0-9_]{20,}' \
              -e 'AKIA[0-9A-Z]{16}' \
              -- app/src/main || true
            exit 1
          fi

      - name: Verify Gradle Wrapper JAR checksum
        shell: bash
        run: |
          set -euo pipefail
          # Supply-chain check: gradle-wrapper.jar must match an official Gradle published SHA-256
          # (https://gradle.org/release-checksums/).
          #
          # Current jar hash is the official wrapper JAR for Gradle 8.7 / 8.8.
          # The distribution downloaded is Gradle 8.9 (see gradle/wrapper/gradle-wrapper.properties
          # distributionUrl + distributionSha256Sum). An older official wrapper may bootstrap a
          # newer distribution; the jar itself must still be an official untampered file.
          #
          # When upgrading Gradle, update ALL of these together or CI will fail on purpose:
          #   1) distributionUrl + distributionSha256Sum in gradle-wrapper.properties
          #   2) gradle/wrapper/gradle-wrapper.jar from the official release
          #   3) the expected= value below (Wrapper JAR Checksum from gradle.org/release-checksums/)
          expected='cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8'
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f 1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: Gradle Wrapper JAR checksum mismatch."
            echo "Expected official wrapper JAR SHA-256: $expected"
            echo "Actual: $actual"
            echo "If you upgraded Gradle, update the jar and this expected hash together."
            exit 1
          fi
          echo "Gradle Wrapper JAR checksum matches the pinned official checksum."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile unit test sources
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --stacktrace

      # Full JVM unit suite — includes AcceptancePathTest, StorageGuardTest, AutonomousLoopTest
      # (no second filtered re-run; that only doubled time without extra coverage)
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 5

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Primary deliverable for phone install. Fail hard if the APK is missing —
      # ignore/warn would let a "green-looking" run ship with nothing to download.
      - name: Upload debug APK
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coding-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      # Compile-check only (not uploaded). Debug APK remains the phone install artifact.
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Instrumentation must pass. API 35 + google_apis matches app target (realistic device class).
      # Transient emulator boot flake: up to 3 attempts (Wandalen/wretry). All attempts fail → job fails.
      # -no-snapshot + disable-spellchecker reduce non-deterministic UI flake.
      - name: Run Android instrumentation tests on emulator
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          attempt_limit: 3
          attempt_delay: 30000
          action: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
          with: |
            api-level: 35
            target: google_apis
            arch: x86_64
            profile: pixel_7
            emulator-boot-timeout: 600
            emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
            disable-animations: true
            disable-spellchecker: true
            script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Android instrumentation reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 5
