name: Android build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test Coding Agent
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # setup-android already accepts licenses; re-run sdkmanager licenses without
          # swallowing failures (|| true would hide a real license/tooling break).
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Security baseline audit
        shell: bash
        run: |
          set -euo pipefail

          # 1) No private signing material tracked or left in the tree
          if git ls-files --error-unmatch app/debug-signing.keystore.b64 >/dev/null 2>&1; then
            echo "ERROR: repository-stored private debug signing material is tracked."
            exit 1
          fi
          if find . -type f \( -name "*.keystore" -o -name "*.jks" \) \
              ! -path "./.git/*" \
              ! -path "*/build/*" \
              -print -quit | grep -q .; then
            echo "ERROR: private signing material exists in the source tree."
            find . -type f \( -name "*.keystore" -o -name "*.jks" \) \
              ! -path "./.git/*" ! -path "*/build/*" -print
            exit 1
          fi

          # 2) No browser/device impersonation User-Agents in production source
          #    (honest "Coding-Agent/..." agents are allowed; Mozilla/Chrome/Pixel/Samsung spoofing is not)
          if git grep -n -E 'Mozilla/5\.0|Chrome/[0-9]+\.|Pixel [0-9]|SamsungBrowser|Windows NT [0-9]|iPhone OS|Android [0-9]+;[^"]*Chrome' -- app/src/main >/dev/null 2>&1; then
            echo "ERROR: browser/device impersonation remains in application source."
            git grep -n -E 'Mozilla/5\.0|Chrome/[0-9]+\.|Pixel [0-9]|SamsungBrowser|Windows NT [0-9]|iPhone OS|Android [0-9]+;[^"]*Chrome' -- app/src/main || true
            exit 1
          fi

          # 3) No hardcoded secret shapes in production source (app/src/main only;
          #    unit tests may use fake sk-/Bearer strings to prove redaction works)
          if git grep -n -E \
              -e 'BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY' \
              -e 'sk-[a-zA-Z0-9]{20,}' \
              -e 'sk_live_[a-zA-Z0-9]{20,}' \
              -e 'sk_test_[a-zA-Z0-9]{20,}' \
              -e 'xai-[a-zA-Z0-9]{20,}' \
              -e 'ghp_[a-zA-Z0-9]{36}' \
              -e 'github_pat_[a-zA-Z0-9_]{20,}' \
              -e 'AKIA[0-9A-Z]{16}' \
              -e 'xox[baprs]-[0-9A-Za-z-]{10,}' \
              -e 'AIza[0-9A-Za-z_-]{35}' \
              -e 'ya29\.[0-9A-Za-z_-]+' \
              -e '-----BEGIN PGP PRIVATE KEY BLOCK-----' \
              -- app/src/main >/dev/null 2>&1; then
            echo "ERROR: possible hardcoded secret pattern in app/src/main."
            git grep -n -E \
              -e 'BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY' \
              -e 'sk-[a-zA-Z0-9]{20,}' \
              -e 'sk_live_[a-zA-Z0-9]{20,}' \
              -e 'sk_test_[a-zA-Z0-9]{20,}' \
              -e 'xai-[a-zA-Z0-9]{20,}' \
              -e 'ghp_[a-zA-Z0-9]{36}' \
              -e 'github_pat_[a-zA-Z0-9_]{20,}' \
              -e 'AKIA[0-9A-Z]{16}' \
              -e 'xox[baprs]-[0-9A-Za-z-]{10,}' \
              -e 'AIza[0-9A-Za-z_-]{35}' \
              -e 'ya29\.[0-9A-Za-z_-]+' \
              -e '-----BEGIN PGP PRIVATE KEY BLOCK-----' \
              -- app/src/main || true
            exit 1
          fi

      - name: Install and verify official Gradle 8.9 Wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          # Always install the official Gradle 8.9 wrapper JAR from the Gradle org tag,
          # then verify SHA-256 against gradle.org/release-checksums (8.9 Wrapper JAR).
          # This removes version skew and blocks a poisoned jar in the working tree.
          expected='498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17'
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f 1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: Official Gradle 8.9 Wrapper JAR checksum mismatch."
            echo "Expected: $expected"
            echo "Actual:   $actual"
            exit 1
          fi
          echo "Official Gradle 8.9 Wrapper JAR installed and checksum verified."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile unit test sources
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --stacktrace

      # Full JVM unit suite — includes AcceptancePathTest, StorageGuardTest, AutonomousLoopTest
      # (no second filtered re-run; that only doubled time without extra coverage)
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 5

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Primary deliverable for phone install. Fail hard if the APK is missing —
      # ignore/warn would let a "green-looking" run ship with nothing to download.
      - name: Upload debug APK
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coding-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      # Compile-check only (not uploaded). Debug APK remains the phone install artifact.
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Instrumentation must pass — one attempt, no retry that could hide a real test failure.
      # Runner is ubuntu-24.04-arm; emulator arch arm64-v8a matches S25-class ABI.
      # -no-snapshot + disable-spellchecker reduce non-deterministic UI flake.
      - name: Run Android instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_7
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Android instrumentation reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 5
